# Debug configuration for KGGLM - fast path sampling for debugging
# Usage: hopwise train KGGLM ml-100k --config-files debug_kgglm.yaml

# Enable chunked processing for memory constraints
use_chunked_loading: true
path_chunk_size: 2000 # Small chunks for debugging

# Existing debug settings
epochs: 1
path_hop_length: 9
MAX_PATHS_PER_USER: 2

path_sample_args:
  restrict_by_phase: False
  pretrain_hop_length: (2,2)
  pretrain_paths: 1
  temporal_causality: False
  strategy: simple-ui
  MAX_RW_TRIES_PER_IID: 1
  parallel_max_workers: 1
  MAX_CONSECUTIVE_INVALID: 3 # Reduced for debugging

# Tokenizer configuration
tokenizer:
  model: WordLevel
  special_tokens:
    mask_token: "[MASK]"
    unk_token: "[UNK]"
    pad_token: "[PAD]"
    bos_token: "[BOS]"
    eos_token: "[EOS]"

# Debug logging
show_progress: True
